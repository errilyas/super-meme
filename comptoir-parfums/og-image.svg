<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="38%" cy="34%" r="85%">
      <stop offset="0" stop-color="#1c1024"/>
      <stop offset="55%" stop-color="#150a19"/>
      <stop offset="100%" stop-color="#0c0610"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#d6a251" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#d6a251" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="au" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e0ac"/><stop offset=".4" stop-color="#e0b268"/>
      <stop offset=".72" stop-color="#c08f3f"/><stop offset="1" stop-color="#8f6a2c"/>
    </linearGradient>
    <linearGradient id="auF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b673"/><stop offset="1" stop-color="#8f6a2c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="url(#auF)" stroke-width="1" opacity=".5"/>

  <!-- flacon facetté, filet or, à droite -->
  <g transform="translate(880 315)" fill="none" stroke="url(#auF)" stroke-width="2" opacity=".55">
    <path d="M-70 -150 L60 -150 L80 -128 L80 150 L60 172 L-70 172 L-90 150 L-90 -128 Z"/>
    <rect x="-56" y="-192" width="112" height="34" rx="3"/>
    <rect x="-34" y="-214" width="68" height="26" rx="3"/>
    <path d="M-90 -20 L80 -20 M-90 40 L80 40" stroke-width="1" opacity=".6"/>
  </g>

  <!-- sceau -->
  <g transform="translate(300 250)">
    <circle r="96" fill="none" stroke="url(#au)" stroke-width="3"/>
    <circle r="88" fill="none" stroke="url(#auF)" stroke-width="1.2" opacity=".55"/>
    <circle r="76" fill="none" stroke="url(#au)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1 9"/>
    <text x="2" y="0" dy=".34em" text-anchor="middle" fill="url(#au)"
          font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="600"
          font-size="92" letter-spacing="-4">CP</text>
  </g>

  <!-- verrou -->
  <text x="140" y="440" fill="url(#au)" font-family="Georgia,'Times New Roman',serif"
        font-style="italic" font-weight="500" font-size="86" letter-spacing="-1">Le Comptoir</text>
  <text x="146" y="486" fill="#a99f8c" font-family="'Helvetica Neue',Arial,sans-serif"
        font-weight="300" font-size="22" letter-spacing="16">DES PARFUMS</text>

  <line x1="146" y1="520" x2="210" y2="520" stroke="url(#au)" stroke-width="1.4"/>
  <text x="146" y="556" fill="#c6ab78" font-family="'Helvetica Neue',Arial,sans-serif"
        font-weight="300" font-size="20" letter-spacing="1">Testeurs originaux des plus grandes maisons — sans le coffret.</text>
  <text x="146" y="586" fill="#8f8677" font-family="'Helvetica Neue',Arial,sans-serif"
        font-weight="300" font-size="18" letter-spacing="2.5">LIVRAISON PARTOUT AU MAROC · PAIEMENT À LA RÉCEPTION</text>
</svg>
